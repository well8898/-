<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- my-schedule/index.html 에서 만든 파일입니다. 화면을 고칠 때는 그 파일을 고친 뒤 다시 만드세요. -->
<title>내 검사 일정</title>
<meta name="theme-color" content="#1f5fbf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column — sticky app bar + swipeable day tabs, one day's site cards at a time */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefa;
  --k-jeong: #2a3440;
  --k-mil: #1d7fc4;
  --k-su: #c27a0e;
  --k-wan: #c2392f;
  --off: #8a6d1e;
  --off-soft: #f8f0dc;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic',
    system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0f1419;
    --surface: #19212a;
    --ink: #e6ebf0;
    --muted: #94a2b0;
    --line: #2a3541;
    --accent: #6ea6f5;
    --accent-ink: #0f1419;
    --accent-soft: #1d2d44;
    --k-jeong: #c9d3dd;
    --k-mil: #5fb4ec;
    --k-su: #e7a84a;
    --k-wan: #f07c72;
    --off: #e2c06e;
    --off-soft: #2e2818;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0f1419;
  --surface: #19212a;
  --ink: #e6ebf0;
  --muted: #94a2b0;
  --line: #2a3541;
  --accent: #6ea6f5;
  --accent-ink: #0f1419;
  --accent-soft: #1d2d44;
  --k-jeong: #c9d3dd;
  --k-mil: #5fb4ec;
  --k-su: #e7a84a;
  --k-wan: #f07c72;
  --off: #e2c06e;
  --off-soft: #2e2818;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
html,
body {
  min-height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col {
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* app bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.bar.scrolled {
  border-bottom-color: var(--line);
}
.bar-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-block: 12px 10px;
}
.who {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.who small {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.who b {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.who b em {
  font-style: normal;
  color: var(--accent);
}
.ghost {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  min-height: 40px;
  white-space: nowrap;
}

/* day tabs */
.tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 6px;
  padding-block: 2px 12px;
}
.tab {
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 7px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-height: 68px;
  cursor: pointer;
}
.tab .dw {
  font-size: 11.5px;
  color: var(--muted);
}
.tab .dd {
  font: 600 clamp(13px, 4.1vw, 17px) var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.tab .st {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
}
.tab.off .st {
  color: var(--off);
}
.tab.none .st {
  color: var(--muted);
}
.tab.today {
  border-color: var(--accent);
}
.tab[aria-selected='true'] {
  background: var(--accent);
  border-color: var(--accent);
}
.tab[aria-selected='true'] .dw,
.tab[aria-selected='true'] .dd,
.tab[aria-selected='true'] .st {
  color: var(--accent-ink);
}

main {
  padding-block: 4px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.week {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.week b {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
}

.dayhead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.dayhead h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.dayhead h2 span {
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 6px;
}
.pill {
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 999px;
  padding: 3px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.pill.off {
  background: var(--off-soft);
  color: var(--off);
}
.pill.none {
  background: var(--surface);
  color: var(--muted);
}
.brief {
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.brief p {
  margin: 0;
  text-wrap: pretty;
}
.brief .crew {
  font-size: 13.5px;
  color: var(--muted);
}
.brief .crew b {
  color: var(--ink);
}

.stops {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stop {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stop-top {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: start;
}
.t {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
.nm {
  font-weight: 600;
  font-size: 16.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.meta {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.kind {
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid currentColor;
  border-radius: 5px;
  padding: 0 6px;
  line-height: 1.5;
}
.k-정 {
  color: var(--k-jeong);
}
.k-밀 {
  color: var(--k-mil);
}
.k-수 {
  color: var(--k-su);
}
.k-완 {
  color: var(--k-wan);
}
.u {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}
.u small {
  font: 400 13px var(--font-body);
  color: var(--muted);
  margin-left: 1px;
}
.maps {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.maps a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.maps a:active {
  background: var(--accent-soft);
}
.note {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.empty-day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
}
.others {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.others b {
  color: var(--ink);
  font-weight: 600;
}
.wday {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.wday-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.wday-h strong {
  font-size: 17px;
}
.wday-h strong span {
  font-size: 13.5px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 5px;
}
.wlist {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.wlist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
}
.wlist li:first-child {
  border-top: 0;
}
.wlist .t,
.wlist .u {
  font-size: 15px;
}
.wlist .nm {
  font-size: 15px;
}
.wlist .others {
  border: 0;
  padding: 2px 0 0;
  font-size: 12.5px;
}
.wlist.flat {
  padding: 12px 14px;
  color: var(--muted);
  font-size: 14px;
}
.kmap {
  height: 260px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
}
.pin {
  min-width: 26px;
  height: 26px;
  padding: 0 7px;
  border-radius: 13px;
  background: #1f5fbf;
  color: #fff;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  font: 600 12px var(--font-mono);
  white-space: nowrap;
}
.pin.home {
  background: #18212b;
}
.legs {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}
.legs h3 {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
}
.leg {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: baseline;
}
.leg span:first-child {
  overflow-wrap: anywhere;
}
.leg .km {
  font: 600 15px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.leg.total {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  font-weight: 700;
}
.legs .copy {
  justify-self: start;
  margin-top: 4px;
}
.legs .route {
  font-size: 12.5px;
  color: var(--muted);
  user-select: all;
  overflow-wrap: anywhere;
}
.hint {
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  margin: 6px 0 0;
}

/* first screen */
.start {
  padding-block: 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.start h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.start h1 em {
  font-style: normal;
  color: var(--accent);
}
.start p {
  margin: 0;
  color: var(--muted);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.field input {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 17px;
  font-weight: 600;
  width: 100%;
}
.big {
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 14px;
  min-height: 56px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
label.ghost {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  pointer-events: none;
}
.vh:focus-visible + * {
  outline: 2px solid var(--accent);
}
.err-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--k-wan);
  color: #fff;
  font-size: 13px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
}
.drop {
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  font-size: 13.5px;
  color: var(--muted);
}
.drop.over {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
}
.msg {
  font-size: 14px;
  text-align: center;
  min-height: 1.5em;
}
.msg.err {
  color: var(--k-wan);
}
@media (hover: none) {
  .drop {
    display: none;
  }
}
@media (max-width: 359px) {
  body {
    font-size: 15px;
  }
  .t,
  .u {
    font-size: 15px;
  }
  .nm {
    font-size: 15.5px;
  }
  .tabs {
    gap: 4px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .panel {
    animation: in 0.18s ease-out;
  }
  @keyframes in {
    from {
      opacity: 0.4;
      transform: translateX(var(--dx, 0));
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}
</style>
</head>
<body>
<input type="file" id="file" accept=".pdf,.xlsx,.xls,.xlsm,application/pdf,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" class="vh" tabindex="-1">
<div class="err-bar" id="errBar" hidden></div>
<script>
// 화면 스크립트가 멈추면 이유를 아래 빨간 줄에 표시 (문제 줄의 실제 내용도 같이)
function errLine(n) {
  if (!n) return '';
  const pick = t => ((t || '').split('\n')[n - 1] || '').trim().slice(0, 90);
  const own = [...document.scripts]
    .filter(x => !x.src)
    .sort((a, b) => b.text.length - a.text.length)[0];
  const a = pick(own && own.text);
  const b = pick(document.documentElement.outerHTML);
  return (a ? ' · 스크립트 줄: ' + a : '') + (b ? ' · 문서 줄: ' + b : '');
}
window.addEventListener(
  'error',
  e => {
    const b = document.getElementById('errBar');
    if (!b) return;
    b.hidden = false;
    b.textContent =
      '화면 오류: ' +
      (e.message ||
        (e.target && e.target.src
          ? '불러오지 못함 ' + e.target.src
          : '알 수 없음')) +
      (e.lineno ? ' (' + e.lineno + '번째 줄)' : '') +
      (e.filename
        ? ' · 파일: ' + (e.filename.split('?')[0].split('/').pop() || '화면')
        : '') +
      errLine(e.lineno);
  },
  true
);
</script>

<section class="gutter" id="startView">
  <div class="col start">
    <div>
      <h1><span id="who0"></span>이번 주 검사 현장</h1>
    </div>
    <p>지사 검사 일정표(엑셀 또는 PDF)를 올리면 내 조의 현장만 골라 날짜별로 보여 줘요.</p>
    <div class="field"><label for="name">내 이름</label><input id="name" value="" placeholder="예: 홍길동" autocomplete="name" enterkeyhint="done"></div>
    <label class="big" id="pick" for="file" role="button" tabindex="0">일정표 파일 고르기</label>
    <div class="drop" id="drop">PC에서는 파일을 여기에 끌어다 놓아도 돼요</div>
    <div class="msg" id="msg"></div>
    <p class="hint">카카오톡으로 받은 파일은 먼저 '저장'한 뒤, 파일 고르기에서 다운로드 폴더(아이폰은 '파일' 앱)를 열면 보여요.<br>파일은 이 화면에서만 읽고 어디에도 보내지 않아요.</p>
  </div>
</section>

<div id="appView" hidden>
  <header class="bar gutter" id="bar">
    <div class="col">
      <div class="bar-in">
        <div class="who"><small id="src">검사 일정표</small><b id="who">내 일정</b></div>
        <label class="ghost" id="repick" for="file" role="button" tabindex="0">파일 바꾸기</label>

  </header>
  <main class="gutter"><div class="col" style="display:flex;flex-direction:column;gap:14px">

    <section class="panel" id="panel" role="tabpanel"></section>
  </div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function parseItems(items, yearHint) {
  const Y = yearHint || new Date().getFullYear();
  // headers
  const heads = items.filter(
    i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s) && !/~/.test(i.s)
  );
  if (heads.length < 1)
    throw new Error('날짜 머리글(예: 10/12 (월))을 찾지 못했어요.');
  const hy = Math.min(...heads.map(h => h.y));
  const cols = heads
    .filter(h => Math.abs(h.y - hy) < 6)
    .map(h => ({ c: h.x + h.w / 2, s: h.s.trim() }))
    .sort((a, b) => a.c - b.c);
  const sp =
    cols.length > 1
      ? (cols[cols.length - 1].c - cols[0].c) / (cols.length - 1)
      : cols[0].c;
  cols.forEach((c, k) => {
    c.l = k ? (cols[k - 1].c + c.c) / 2 : c.c - sp / 2;
    c.r = k < cols.length - 1 ? (c.c + cols[k + 1].c) / 2 : c.c + sp / 2;
    const m = c.s.match(/(\d{1,2})\/(\d{1,2})/);
    const d = new Date(Y, +m[1] - 1, +m[2]);
    c.date = d;
  });
  const labels = items
    .filter(i => /^\s*\d{1,2}\s*조\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2)
    .map(i => ({ y: i.y, t: i.s.replace(/\s/g, '') }))
    .sort((a, b) => a.y - b.y);
  const rowLabels = items.filter(
    i => /^\s*(행사|복무)\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2

      const r = await run('geocodeSites', need);
      if (!r.ok) throw new Error(r.message);
      need.forEach(x => (GEO[x.q] = r.places[x.q] || null));
    }
    // 방문 순서: 지사 → 현장들(같은 건물 연속은 하나로) → 지사
    const stops = [];
    d.t.stops.forEach((s, i) => {
      const g = GEO[mapQuery(s)];
      if (!g) return;
      const last = stops[stops.length - 1];
      if (last && ll(last.g) === ll(g)) last.nums.push(i + 1);
      else stops.push({ g, nums: [i + 1], name: s.name });
    });
    const pts = ORIGIN
      ? [
          { g: ORIGIN, name: ORIGIN.name, home: 1 },
          ...stops,
          { g: ORIGIN, name: ORIGIN.name, home: 1 }
        ]
      : stops;
    const pairs = [];
    for (let i = 0; i + 1 < pts.length; i++) {
      const k = ll(pts[i].g) + '>' + ll(pts[i + 1].g);
      if (!(k in LEGS) && !pairs.some(p => p.k === k))
        pairs.push({ k, a: pts[i].g, b: pts[i + 1].g });
    }
    if (pairs.length) {
      const r = await run(
        'routeLegs',
        pairs.map(p => [+p.a.lat, +p.a.lng, +p.b.lat, +p.b.lng])
      );
      if (!r.ok) throw new Error(r.message);
      pairs.forEach((p, i) => (LEGS[p.k] = r.km[i]));
    }
    if (sel !== iso) return;
    drawLegs(d, pts);
    drawDayMap(stops);
  } catch (e) {
    if (sel === iso && $('dlegs'))
      $('dlegs').innerHTML =
        `<p class="note">위치·거리 계산 실패: ${esc(e.message || e)}</p>`;
  }
}
function drawLegs(d, pts) {
  const el = $('dlegs');
  if (!el) return;
  if (pts.length < 2) {
    el.innerHTML =
      '<p class="note">지도에 찍을 수 있는 현장이 없어요. 주소가 없는 현장은 지도와 거리 계산에서 빠져요.</p>';
    return;
  }
  let tot = 0,
    unknown = false;
  const rows = [];
  for (let i = 0; i + 1 < pts.length; i++) {
    const km = LEGS[ll(pts[i].g) + '>' + ll(pts[i + 1].g)];
    if (km == null) unknown = true;
    else tot += km;
    const nm = x => (x.home ? x.name : x.nums.join('·') + '. ' + x.name);
    rows.push(
      `<div class="leg"><span>${esc(nm(pts[i]))} → ${esc(nm(pts[i + 1]))}</span><span class="km">${km == null ? '–' : km.toFixed(1) + 'km'}</span></div>`
    );
  }
  const skipped = d.t.stops.filter(s => !GEO[mapQuery(s)]).length;
  const route = pts.map(x => x.name).join(' → ');
  el.innerHTML = `<h3>이동거리 (자동차 추천경로)</h3>${rows.join('')}
    <div class="leg total"><span>합계</span><span class="km">${tot.toFixed(1)}km${unknown ? '+' : ''}</span></div>
    <div class="route" id="routeText">${esc(route)} (${tot.toFixed(1)}km)</div>
    <button class="ghost copy" type="button" id="copyRoute">경로·거리 복사</button>
    ${skipped ? `<p class="note">위치를 모르는 현장 ${skipped}곳은 지도와 거리 계산에서 빠졌어요.</p>` : ''}`;
  $('copyRoute').onclick = () => {
    const t = $('routeText').textContent;
    const done = () => {
      $('copyRoute').textContent = '복사했어요';
    };
    (navigator.clipboard
      ? navigator.clipboard.writeText(t).then(done)
      : Promise.reject()
    ).catch(() => {
      const r = document.createRange();
      r.selectNodeContents($('routeText'));
      const sl = getSelection();
      sl.removeAllRanges();
      sl.addRange(r);
      $('copyRoute').textContent = '선택됨 · 길게 눌러 복사';
    });
  };
}
async function drawDayMap(stops) {
  const el = $('dmap');
  if (!el || !stops.length) return;
  const k = await loadKakao();
  if (!k) {
    el.hidden = false;
    el.style.height = 'auto';
    el.innerHTML = `<p class="note" style="padding:12px">${kakaoError}</p>`;
    return;
  }
  el.hidden = false;
  const LL = g => new k.maps.LatLng(+g.lat, +g.lng);
  const map = new k.maps.Map(el, { center: LL(stops[0].g), level: 5 });
  const b = new k.maps.LatLngBounds();
  const add = (g, label, cls) => {
    b.extend(LL(g));
    new k.maps.CustomOverlay({
      map,
      position: LL(g),
      yAnchor: 0.5,
      content: `<div class="pin${cls || ''}">${label}</div>`
    });
  };
  stops.forEach(x => add(x.g, x.nums.join('·')));
  if (ORIGIN) add(ORIGIN, '지사', ' home');
  const path = (ORIGIN ? [ORIGIN] : []).concat(
    stops.map(x => x.g),
    ORIGIN ? [ORIGIN] : []
  );
  if (path.length > 1)
    new k.maps.Polyline({
      map,
      path: path.map(LL),
      strokeWeight: 3,
      strokeColor: '#1f5fbf',
      strokeOpacity: 0.7,
      strokeStyle: 'shortdash'
    });
  if (stops.length + (ORIGIN ? 1 : 0) > 1) map.setBounds(b, 40, 40, 40, 40);
}

// 좌우로 밀어서 날짜 넘기기
let sx = null,
  sy = 0;
$('panel').addEventListener(
  'touchstart',
  e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  },
  { passive: true }
);
$('panel').addEventListener(
  'touchend',
  e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx,
      dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const order = ['week', ...days.map(d => d.iso)];
    const i = order.indexOf(sel);
    const n = order[i + (dx < 0 ? 1 : -1)];
    if (n) go(n, dx < 0 ? 40 : -40);
  },
  { passive: true }
);
addEventListener(
  'scroll',
  () => $('bar').classList.toggle('scrolled', scrollY > 4),
  { passive: true }
);

// ---------- file loading ----------
async function pdfItems(buf) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const items = [];
  let off = 0;
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const vp = pg.getViewport({ scale: 1 });
    const tc = await pg.getTextContent();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      items.push({
        x: it.transform[4],
        y: vp.height - it.transform[5] + off,
        w: it.width,
        s: it.str
      });
    }
    off += vp.height;
  }
  return items;
}
function sheetItems(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn];
    if (!ws['!ref']) continue;
    const R = XLSX.utils.decode_range(ws['!ref']);
    const merges = ws['!merges'] || [];
    const items = [];
    for (let r = R.s.r; r <= R.e.r; r++)
      for (let c = R.s.c; c <= R.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        if (!cell || cell.v == null || cell.v === '') continue;
        let s = cell.w != null ? String(cell.w) : String(cell.v);
        if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
          const dc = XLSX.SSF.parse_date_code(cell.v);
          s =
            dc.m +
            '/' +
            dc.d +
            ' (' +
            DOW[new Date(dc.y, dc.m - 1, dc.d).getDay()] +
            ')';
        }
        if (cell.t === 'd') {
          const dt = new Date(cell.v);
          s =
            dt.getMonth() +
            1 +
            '/' +
            dt.getDate() +
            ' (' +
            DOW[dt.getDay()] +
            ')';
        }
        const mg = merges.find(m => m.s.r === r && m.s.c === c);
        const w = mg ? (mg.e.c - mg.s.c + 1) * 100 : 100;
        s.split(/\r?\n/).forEach((ln, i) => {
          if (ln.trim())
            items.push({ x: c * 100, y: r * 50 + i * 4, w, s: ln.trim() });
        });
      }
    if (items.some(i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s)))
      return { items, sheet: sn };
  }
  throw new Error(
    '엑셀에서 날짜 머리글(예: 10/12 (월))이 있는 시트를 찾지 못했어요.'
  );
}

async function load(file) {
  const msg = $('msg');
  msg.className = 'msg';
  msg.textContent = file.name + ' 읽는 중…';
  try {
    if (typeof pdfjsLib === 'undefined' || typeof XLSX === 'undefined')
      throw new Error(
        '파일 읽기 도구(cdnjs.cloudflare.com)를 불러오지 못했어요. 인터넷 연결이나 회사망 차단을 확인해 주세요.'
      );
    const buf = await file.arrayBuffer();
    const yr = (file.name.match(/20\d\d/) || [])[0];
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    const items = isPdf ? await pdfItems(buf) : sheetItems(buf).items;
    const t = items.find(i => /일정표/.test(i.s));
    const ds = parseItems(items, yr ? +yr : undefined);
    if (!ds.some(d => d.teams.length))
      throw new Error(
        '조별 일정([n현장 n대] 줄)을 찾지 못했어요. 지사 검사 일정표 양식이 맞는지 확인해 주세요.'
      );
    data = {
      source: t ? t.s.replace(/^[\s-]+/, '').trim() : file.name,
      days: ds
    };
    sel = null;
    msg.textContent = '';
    render();
    window.scrollTo({ top: 0 });
  } catch (e) {
    if (data) {
      data = null;
      render();
    }
    msg.className = 'msg err';
    msg.textContent = e.message || '파일을 읽지 못했어요.';
  }
}
// 버튼은 <label for="file"> 라서 스크립트 없이도 파일 선택이 열림. 키보드(Enter·Space)만 처리
['pick', 'repick'].forEach(id =>
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      $('file').click();
    }
  })
);
$('file').onchange = e => {
  if (e.target.files[0]) load(e.target.files[0]);
  e.target.value = '';
};
document.addEventListener('dragover', e => {
  e.preventDefault();
  $('drop').classList.add('over');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) $('drop').classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) load(f);
});
$('name').addEventListener('input', () => {
  store.set('sched.name', $('name').value.trim());
  render();
});
render();
