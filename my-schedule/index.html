<title>내 검사 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f5fbf">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
/* Layout: phone-first single column — sticky app bar + swipeable day tabs, one day's site cards at a time */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefa;
  --k-jeong: #2a3440;
  --k-mil: #1d7fc4;
  --k-su: #c27a0e;
  --k-wan: #c2392f;
  --off: #8a6d1e;
  --off-soft: #f8f0dc;
  --hero: #1f5fbf;
  --hero-ink: #ffffff;
  --font-body: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic',
    system-ui, sans-serif;
  --font-mono: var(--font-body);
  --tmap: #3d5afe;
  --kakao: #fee500;
  --naver: #03c75a;
  --line-b: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0f1419;
    --surface: #19212a;
    --ink: #e6ebf0;
    --muted: #94a2b0;
    --line: #2a3541;
    --accent: #6ea6f5;
    --accent-ink: #0f1419;
    --accent-soft: #1d2d44;
    --k-jeong: #c9d3dd;
    --k-mil: #5fb4ec;
    --k-su: #e7a84a;
    --k-wan: #f07c72;
    --off: #e2c06e;
    --off-soft: #2e2818;
    --hero: #1e3a66;
    --hero-ink: #eef4ff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0f1419;
  --surface: #19212a;
  --ink: #e6ebf0;
  --muted: #94a2b0;
  --line: #2a3541;
  --accent: #6ea6f5;
  --accent-ink: #0f1419;
  --accent-soft: #1d2d44;
  --k-jeong: #c9d3dd;
  --k-mil: #5fb4ec;
  --k-su: #e7a84a;
  --k-wan: #f07c72;
  --off: #e2c06e;
  --off-soft: #2e2818;
  --hero: #1e3a66;
  --hero-ink: #eef4ff;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
html,
body {
  min-height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col {
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* app bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.bar.scrolled {
  border-bottom-color: var(--line);
}
.bar-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-block: 12px 10px;
}
.who {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.who small {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.who b {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.who b em {
  font-style: normal;
  color: var(--accent);
}
.ghost {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  min-height: 40px;
  white-space: nowrap;
}

/* day tabs */
.tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 6px;
  padding-block: 2px 12px;
}
.tab {
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 7px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-height: 68px;
  cursor: pointer;
}
.tab .dw {
  font-size: 11.5px;
  color: var(--muted);
}
.tab .dd {
  font: 600 clamp(13px, 4.1vw, 17px) var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.tab .st {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
}
.tab.off .st {
  color: var(--off);
}
.tab.none .st {
  color: var(--muted);
}
.tab.today {
  border-color: var(--accent);
}
.tab[aria-selected='true'] {
  background: var(--accent);
  border-color: var(--accent);
}
.tab[aria-selected='true'] .dw,
.tab[aria-selected='true'] .dd,
.tab[aria-selected='true'] .st {
  color: var(--accent-ink);
}

main {
  padding-block: 4px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.week {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.week b {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
}

.dayhead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.dayhead h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.dayhead h2 span {
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 6px;
}
.pill {
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 999px;
  padding: 3px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.pill.off {
  background: var(--off-soft);
  color: var(--off);
}
.pill.none {
  background: var(--surface);
  color: var(--muted);
}
.brief {
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.brief p {
  margin: 0;
  text-wrap: pretty;
}
.brief .crew {
  font-size: 13.5px;
  color: var(--muted);
}
.brief .crew b {
  color: var(--ink);
}

.stops {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stop {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.t {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
.nm {
  font-weight: 600;
  font-size: 16.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.meta {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.kind {
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid currentColor;
  border-radius: 5px;
  padding: 0 6px;
  line-height: 1.5;
}
.k-정 {
  color: var(--k-jeong);
}
.k-밀 {
  color: var(--k-mil);
}
.k-수 {
  color: var(--k-su);
}
.k-설,
.k-완 {
  color: var(--k-wan);
}
.u {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}
.u small {
  font: 400 13px var(--font-body);
  color: var(--muted);
  margin-left: 1px;
}
.maps {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.maps a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.maps a:active {
  background: var(--accent-soft);
}
.note {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.empty-day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
}
.others {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.others b {
  color: var(--ink);
  font-weight: 600;
}
.wday {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.wday-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.wday-h strong {
  font-size: 17px;
}
.wday-h strong span {
  font-size: 13.5px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 5px;
}
.wlist {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.wlist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
}
.wlist li:first-child {
  border-top: 0;
}
.wlist .t,
.wlist .u {
  font-size: 15px;
}
.wlist .nm {
  font-size: 15px;
}
.wlist .others {
  border: 0;
  padding: 2px 0 0;
  font-size: 12.5px;
}
.wlist.flat {
  padding: 12px 14px;
  color: var(--muted);
  font-size: 14px;
}
.kmap {
  height: 260px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
}
.pin {
  min-width: 26px;
  height: 26px;
  padding: 0 7px;
  border-radius: 13px;
  background: #1f5fbf;
  color: #fff;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  font: 600 12px var(--font-mono);
  white-space: nowrap;
}
.pin.home {
  background: #18212b;
}
.legs {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}
.legs h3 {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
}
.leg {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: baseline;
}
.leg span:first-child {
  overflow-wrap: anywhere;
}
.leg .km {
  font: 600 15px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.leg.total {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  font-weight: 700;
}
.legs .copy {
  justify-self: start;
  margin-top: 4px;
}
.legs .route {
  font-size: 12.5px;
  color: var(--muted);
  user-select: all;
  overflow-wrap: anywhere;
}
.hint {
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  margin: 6px 0 0;
}

/* first screen */
.start {
  padding-block: 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.start h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.start h1 em {
  font-style: normal;
  color: var(--accent);
}
.start p {
  margin: 0;
  color: var(--muted);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.field input {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 17px;
  font-weight: 600;
  width: 100%;
}
.big {
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 14px;
  min-height: 56px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
label.ghost {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  pointer-events: none;
}
.vh:focus-visible + * {
  outline: 2px solid var(--accent);
}
.err-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--k-wan);
  color: #fff;
  font-size: 13px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
}
.drop {
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  font-size: 13.5px;
  color: var(--muted);
}
.drop.over {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
}
.msg {
  font-size: 14px;
  text-align: center;
  min-height: 1.5em;
}
.msg.err {
  color: var(--k-wan);
}
@media (hover: none) {
  .drop {
    display: none;
  }
}
@media (max-width: 359px) {
  body {
    font-size: 15px;
  }
  .t,
  .u {
    font-size: 15px;
  }
  .nm {
    font-size: 15.5px;
  }
  .tabs {
    gap: 4px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .panel {
    animation: in 0.18s ease-out;
  }
  @keyframes in {
    from {
      opacity: 0.4;
      transform: translateX(var(--dx, 0));
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}

/* ---- 하루 보기 (요약 · 지도 · 타임라인) ---- */
.panel{display:flex;flex-direction:column;gap:12px}
.sum{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 6px 18px -10px rgba(20,50,110,.55)}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum-date{font:600 15px var(--font-body);opacity:.85}
.sum-team{font-size:12.5px;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:1px 9px;opacity:.85}
.sum-foot{font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.22);padding-top:9px}
.kmap{position:relative}
.kload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);padding:16px}
.kload small{font-weight:400;color:var(--muted);font-size:12.5px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legs .wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.legs .wait .spin{width:18px;height:18px;border-width:2px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:12px}
.tl-item::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font:600 13px var(--font-mono);position:relative;z-index:1;margin-top:10px}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-head{display:flex;align-items:center;gap:8px}
.tl-head .t{font-size:16px;padding:0}
.tl-head .u{margin-left:auto;font-size:15px}
.tl-card .nm{font-size:16px}
.addr{font-size:13px;color:var(--muted)}
.tl-card .others{margin-top:2px}
.tl-card .maps{margin-top:4px}
.tl-card .maps a{min-height:36px;font-size:13.5px;border-radius:9px}
.sum{gap:6px}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sum-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;
  border-top:1px solid rgba(255,255,255,.13)}
.sum-list li:first-child{border-top:0}
.sum-list .st{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
.sum-list .sn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-list .sa{font-size:12.5px;font-weight:400;opacity:.72;margin-left:6px}
.sum-list .sk{font-size:12.5px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px}
.sum-foot{padding-top:8px;margin-top:2px}
.branch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.branch select{font:600 14px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.branch small{font-size:12px}
.branch .juris{flex-basis:100%;color:var(--muted);line-height:1.4}
.real{white-space:nowrap;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:4px}
.maps.three{grid-template-columns:1fr 1fr 1fr}
.leg .km small{font:400 12px var(--font-body);color:var(--muted)}
.dayroute{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.dayroute b{font-size:14px}
.dayroute small{font-size:12.5px;color:var(--muted)}
.dayroute .maps a{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maps button{font:600 13.5px var(--font-body);min-height:36px;border-radius:9px;background:var(--bg);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.resume{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.resume.old{border-color:var(--line)}
.resume small{color:var(--muted);font-size:12.5px}
.resume b{font-size:16px}
/* 버튼 글자가 항상 버튼 안에 들어가게: 좁으면 글자를 줄이고 두 줄까지 */
.maps a,.maps button{min-width:0;padding:6px 6px;font-size:clamp(11.5px,3.5vw,14px);line-height:1.25;text-align:center;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center}
.maps.three a,.maps.three button{font-size:clamp(11px,3.2vw,13.5px);padding:6px 4px}
.ghost,.tab{min-width:0}

<script>
// 화면 스크립트가 멈추면 이유를 아래 빨간 줄에 표시 (문제 줄의 실제 내용도 같이)
function errLine(n) {
  if (!n) return '';
  const pick = t => ((t || '').split('\n')[n - 1] || '').trim().slice(0, 90);
  const own = [...document.scripts]
    .filter(x => !x.src)
    .sort((a, b) => b.text.length - a.text.length)[0];
  const a = pick(own && own.text);
  const b = pick(document.documentElement.outerHTML);
  return (a ? ' · 스크립트 줄: ' + a : '') + (b ? ' · 문서 줄: ' + b : '');
}
window.addEventListener(
  'error',
  e => {
    const b = document.getElementById('errBar');
    if (!b) return;
    b.hidden = false;
    b.textContent =
      '화면 오류: ' +
      (e.message ||
        (e.target && e.target.src
          ? '불러오지 못함 ' + e.target.src
          : '알 수 없음')) +
      (e.lineno ? ' (' + e.lineno + '번째 줄)' : '') +
      (e.filename
        ? ' · 파일: ' + (e.filename.split('?')[0].split('/').pop() || '화면')
        : '') +
      errLine(e.lineno);
  },
  true
);
</script>

<script>
function parseItems(items, yearHint) {
  const Y = yearHint || new Date().getFullYear();
  // headers
  const heads = items.filter(
    i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s) && !/~/.test(i.s)
  );
  if (heads.length < 1)
    throw new Error('날짜 머리글(예: 10/12 (월))을 찾지 못했어요.');
  const hy = Math.min(...heads.map(h => h.y));
  const cols = heads
    .filter(h => Math.abs(h.y - hy) < 6)
    .map(h => ({ c: h.x + h.w / 2, s: h.s.trim() }))
    .sort((a, b) => a.c - b.c);
  const sp =
    cols.length > 1
      ? (cols[cols.length - 1].c - cols[0].c) / (cols.length - 1)
      : cols[0].c;
  cols.forEach((c, k) => {
    c.l = k ? (cols[k - 1].c + c.c) / 2 : c.c - sp / 2;
    c.r = k < cols.length - 1 ? (c.c + cols[k + 1].c) / 2 : c.c + sp / 2;
    const m = c.s.match(/(\d{1,2})\/(\d{1,2})/);
    const d = new Date(Y, +m[1] - 1, +m[2]);
    c.date = d;
  });
  const labels = items
    .filter(i => /^\s*\d{1,2}\s*조\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2)
    .map(i => ({ y: i.y, t: i.s.replace(/\s/g, '') }))
    .sort((a, b) => a.y - b.y);
  const rowLabels = items.filter(
    i => /^\s*(행사|복무)\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2
  );
  const firstMisc = rowLabels.length

async function drawDayMap(stops) {
  const el = $('dmap');
  if (!el) return;
  if (!stops.length) {
    el.style.height = 'auto';
    el.innerHTML =
      '<p class="note" style="padding:14px">지도에 찍을 수 있는 현장이 없어요. 주소가 없는 현장은 지도에서 빠져요.</p>';
    return;
  }
  const k = await loadKakao();
  if (!k) {
    el.style.height = 'auto';
    el.innerHTML = `<p class="note" style="padding:14px">${kakaoError}</p>`;
    return;
  }
  el.innerHTML = '';
  const LL = g => new k.maps.LatLng(+g.lat, +g.lng);
  const map = new k.maps.Map(el, { center: LL(stops[0].g), level: 5 });
  const b = new k.maps.LatLngBounds();
  const add = (g, label, cls) => {
    b.extend(LL(g));
    new k.maps.CustomOverlay({
      map,
      position: LL(g),
      yAnchor: 0.5,
      content: `<div class="pin${cls || ''}">${label}</div>`
    });
  };
  stops.forEach(x => add(x.g, x.nums.join('·')));
  if (ORIGIN) add(ORIGIN, '지사', ' home');
  const path = (ORIGIN ? [ORIGIN] : []).concat(
    stops.map(x => x.g),
    ORIGIN ? [ORIGIN] : []
  );
  if (path.length > 1)
    new k.maps.Polyline({
      map,
      path: path.map(LL),
      strokeWeight: 3,
      strokeColor: '#1f5fbf',
      strokeOpacity: 0.7,
      strokeStyle: 'shortdash'
    });
  if (stops.length + (ORIGIN ? 1 : 0) > 1) map.setBounds(b, 40, 40, 40, 40);
}

// ---------- 홈 화면 위젯 (웹앱 전용): 내 일정만 저장 → 개인 주소(?w=키)로 위젯 앱이 읽음 ----------
function widgetKeyGet() {
  let k = store.get('sched.wkey');
  if (!/^[a-z0-9]{12,32}$/.test(k || '')) {
    const a = new Uint8Array(12);
    crypto.getRandomValues(a);
    k = [...a].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join('');
    store.set('sched.wkey', k);
  }
  return k;
}
let widgetSig = '',
  widgetTimer = null,
  widgetKmSent = {},
  widgetKmTot = {};
function syncWidget() {
  const name = curName();
  if (!data || !name) return;
  clearTimeout(widgetTimer);
  widgetTimer = setTimeout(async () => {
    const payload = {
      name,
      branch: BRANCH ? [BRANCH[0], BRANCH[1]] : null,
      days: mine(name).map(d => {
        const { md, dow } = mdow(d);
        return {
          iso: d.iso,
          label: md + '(' + dow + ')',
          off: !!d.off,
          team: d.t ? d.t.team : '',
          mates: d.t ? d.t.members.filter(m => bare(m) !== name).map(bare) : [],
          stops: d.t
            ? d.t.stops.map(s => ({ time: s.time, kind: s.kind, area: s.area, name: placeName(s.name), units: s.units }))
            : []
        };
      })
    };
    const raw = JSON.stringify(payload);
    let h = 0;
    for (let i = 0; i < raw.length; i++) h = (h * 31 + raw.charCodeAt(i)) | 0;
    const sig = widgetKeyGet() + ':' + h;
    if (!widgetSig) widgetSig = store.get('sched.wsig') || '';
    if (sig === widgetSig) return widgetBox();
    try {
      await cfgReady;
      const r = await run('saveWidget', widgetKeyGet(), payload);
      if (r && r.ok) {
        widgetSig = sig;
        store.set('sched.wsig', sig);
        widgetKmSent = {};
        // 저장 전에 계산된 하루 km도 보냄
        Object.keys(widgetKmTot).forEach(iso => widgetKm(iso, widgetKmTot[iso], false));
      }
    } catch (e) {}
    widgetBox();
  }, 1200);
}
function widgetKm(iso, tot, unknown) {
  if (!unknown && tot > 0) widgetKmTot[iso] = tot;
  if (SERVER && !unknown && tot > 0 && widgetKmSent[iso] !== tot && widgetSig) {
    widgetKmSent[iso] = tot;
    run('saveWidgetKm', widgetKeyGet(), iso, tot.toFixed(1)).catch(() => {});
  }
  return '';
}

  const el = $('widgetBox');

// ---------- file loading ----------
async function pdfItems(buf) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const items = [];
  // 색칠된 칸(검사 종류 색 구분용)과 PDF 제목(예: 경남서부지사 2026년 일정표)
  items.rects = [];
  try {
    const meta = await doc.getMetadata();
    items.title = (meta && meta.info && meta.info.Title) || '';
  } catch (e) {}
  let off = 0;
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const vp = pg.getViewport({ scale: 1 });
    try {
      await pdfRects(pg, vp, off, items.rects);
    } catch (e) {}
    const tc = await pg.getTextContent();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      items.push({
        x: it.transform[4],
        y: vp.height - it.transform[5] + off,
        w: it.width,
        s: it.str
      });
    }
    off += vp.height;
  }
  return items;
}
// 페이지의 색칠된 사각형 → [{ x0, y0, x1, y1, c: [r, g, b] }] (흰색 제외, 위가 0인 좌표)
async function pdfRects(pg, vp, off, out) {
  const ol = await pg.getOperatorList();
  const O = pdfjsLib.OPS;
  const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  let ctm = [1, 0, 0, 1, 0, 0], fill = [255, 255, 255], path = null;
  const st = [];
  ol.fnArray.forEach((f, i) => {
    const a = ol.argsArray[i];
    if (f === O.save) st.push([ctm, fill]);
    else if (f === O.restore) [ctm, fill] = st.pop() || [ctm, fill];
    else if (f === O.transform) ctm = mul(ctm, a);
    else if (f === O.setFillRGBColor) fill = typeof a[0] === 'string' ? [1, 3, 5].map(k => parseInt(a[0].slice(k, k + 2), 16)) : [a[0], a[1], a[2]];
    else if (f === O.setFillGray) fill = [a[0] * 255, a[0] * 255, a[0] * 255];
    else if (f === O.constructPath && a[2]) {
      const mm = a[2];
      const p = [[mm[0], mm[2]], [mm[1], mm[3]]].map(([x, y]) => [ctm[0] * x + ctm[2] * y + ctm[4], ctm[1] * x + ctm[3] * y + ctm[5]]);
      path = { x0: Math.min(p[0][0], p[1][0]), x1: Math.max(p[0][0], p[1][0]), y0: vp.height - Math.max(p[0][1], p[1][1]) + off, y1: vp.height - Math.min(p[0][1], p[1][1]) + off };
    } else if (f === O.fill || f === O.eoFill || f === O.fillStroke || f === O.eoFillStroke) {
      if (path && !(fill[0] > 250 && fill[1] > 250 && fill[2] > 250)) out.push({ ...path, c: fill });
      path = null;
    } else if (f === O.endPath) path = null;
  });
}
function sheetItems(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn];
    if (!ws['!ref']) continue;
    const R = XLSX.utils.decode_range(ws['!ref']);
    const merges = ws['!merges'] || [];
    const items = [];
    for (let r = R.s.r; r <= R.e.r; r++)
      for (let c = R.s.c; c <= R.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        if (!cell || cell.v == null || cell.v === '') continue;
        let s = cell.w != null ? String(cell.w) : String(cell.v);
        if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
          const dc = XLSX.SSF.parse_date_code(cell.v);
          s =
            dc.m +
            '/' +
            dc.d +
            ' (' +
            DOW[new Date(dc.y, dc.m - 1, dc.d).getDay()] +
            ')';
        }
        if (cell.t === 'd') {
          const dt = new Date(cell.v);
          s =
            dt.getMonth() +
            1 +
            '/' +
            dt.getDate() +
            ' (' +
            DOW[dt.getDay()] +
            ')';
        }
        const mg = merges.find(m => m.s.r === r && m.s.c === c);
        const w = mg ? (mg.e.c - mg.s.c + 1) * 100 : 100;
        s.split(/\r?\n/).forEach((ln, i) => {
          if (ln.trim())
            items.push({ x: c * 100, y: r * 50 + i * 4, w, s: ln.trim() });
        });
      }
    if (items.some(i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s)))
      return { items, sheet: sn };
  }
  throw new Error(
    '엑셀에서 날짜 머리글(예: 10/12 (월))이 있는 시트를 찾지 못했어요.'
  );
}

// 파일 읽기 도구(pdf.js·SheetJS)는 처음 화면을 막지 않게 나중에 받음
let libsReady = null;
function loadLibs() {
  if (!libsReady) {
    const one = src =>
      new Promise((res, rej) => {
        const sc = document.createElement('script');
        sc.src = src;
        sc.onload = res;
        sc.onerror = () => rej(new Error('불러오기 실패: ' + src));
        document.head.appendChild(sc);
      });
    const cdn = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/';
    libsReady = Promise.all([one(cdn + 'pdf.js/3.11.174/pdf.min.js'), one(cdn + 'xlsx/0.18.5/xlsx.full.min.js')]).catch(e => {
      libsReady = null;
      throw e;
    });
  }
  return libsReady;
}
// 첫 화면(파일 고르기)이면 쉬는 시간에 미리 받아 둠
(window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => {
  if (!data) loadLibs().catch(() => {});
});
async function load(file) {
  const msg = $('msg');
  msg.className = 'msg';
  msg.textContent = file.name + ' 읽는 중…';
  try {
    try {
      await loadLibs();
    } catch (e) {}
    if (typeof pdfjsLib === 'undefined' || typeof XLSX === 'undefined')
      throw new Error(
        '파일 읽기 도구(cdnjs.cloudflare.com)를 불러오지 못했어요. 인터넷 연결이나 회사망 차단을 확인해 주세요.'
      );
    const buf = await file.arrayBuffer();
    const yr = (file.name.match(/20\d\d/) || [])[0];
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    const items = isPdf ? await pdfItems(buf) : sheetItems(buf).items;
    const t = items.find(i => /일정표/.test(i.s));
    const yy = t && (t.s.match(/(\d{2})년/) || [])[1];
    // 구글 시트형 주간 검사 일정표(경남서부 등)는 따로 읽음
    const gsw = isPdf && isGsWeek(items);
    const y4 = (((items.title || '') + ' ' + items.map(i => i.s).join(' ')).match(/(20\d\d)[.년]/) || [])[1];
    const year = yr ? +yr : y4 && gsw ? +y4 : yy ? 2000 + +yy : undefined;
    let ds;
    try {
      ds = gsw ? parseGsWeek(items, items.rects || [], year) : parseItems(items, year);
    } catch (e1) {
      // 양식 구분이 애매하면 다른 방식으로도 한 번 더
      try {
        ds = gsw ? parseItems(items, year) : parseGsWeek(items, items.rects || [], year);
      } catch (e2) {
        throw e1;
      }
    }
    if (!ds.some(d => d.teams.length))
      throw new Error(
        '조별 일정([n현장 n대] 줄)을 찾지 못했어요. 지사 검사 일정표 양식이 맞는지 확인해 주세요.'
      );
    const range = gsw && ((items.map(i => i.s).join('').match(/\(\s*20\d\d\.[\d.]+~[\d.]+\s*\)/) || [])[0] || '');
    data = {
      source: gsw ? (items.title || '주간 검사 일정표') + (range ? ' ' + range : '') : t ? t.s.replace(/^[\s-]+/, '').trim() : file.name,
      days: ds
    };
    sel = null;
    shared = null;
    msg.textContent = '';
    saveLast();
    const fromTitle = branchFromText((t ? t.s : '') + ' ' + (items.title || '') + ' ' + file.name);
    const saved = branchByName(store.get('sched.branch'));
    if (fromTitle) setBranch(fromTitle, 'title');
    else {
      setBranch(saved, saved ? 'saved' : '');
      guessBranch();
    }
    render();
    window.scrollTo({ top: 0 });
    // 올리면 바로 지사에 공유 (지사를 알 때만. 더 최근 일정표가 있으면 묻고)
    if (SERVER && BRANCH && !LINK) doShare(false);
  } catch (e) {
    if (data) {
      data = null;
      render();
    }
    msg.className = 'msg err';
    msg.textContent = e.message || '파일을 읽지 못했어요.';
  }
}
// 지난 일정표: 이 휴대폰에 저장해 두고 첫 화면에서 '이어서 보기'
function saveLast() {
  try {
    store.set('sched.last', JSON.stringify({ data, at: Date.now() }));
  } catch (e) {}
}
function resumeCard() {
  const el = $('resume');
  let last = null;
  try {
    last = JSON.parse(store.get('sched.last') || 'null');
  } catch (e) {}
  if (!last || !last.data || !last.data.days || !last.data.days.length) {
    el.hidden = true;
    return;
  }
  const ds = last.data.days;
  const past = ds[ds.length - 1].iso < todayIso;
  const at = new Date(last.at);
  el.hidden = false;
  el.classList.toggle('old', past);
  el.innerHTML = `<small>${past ? '지난주 일정표예요 · 새 파일을 올려 주세요' : '지난번에 올린 일정표'}</small>
    <b>${esc(last.data.source || '검사 일정표')}</b>
    <small>${at.getMonth() + 1}/${at.getDate()} ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}에 올림</small>
    <div class="maps"><button type="button" class="${past ? '' : 'call'}" id="resumeGo">이어서 보기</button><button type="button" id="resumeDel">지우기</button></div>`;
  $('resumeGo').onclick = () => {
    data = last.data;
    sel = null;
    const fromTitle = branchFromText(data.source || '');
    const saved = branchByName(store.get('sched.branch'));
    setBranch(fromTitle || saved, fromTitle ? 'title' : saved ? 'saved' : '');
    if (!fromTitle && !saved) guessBranch();
    render();
  };
  $('resumeDel').onclick = () => {
    store.set('sched.last', '');
    resumeCard();
  };
}
// 버튼은 <label for="file"> 라서 스크립트 없이도 파일 선택이 열림. 키보드(Enter·Space)만 처리
['pick', 'repick'].forEach(id =>
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      $('file').click();
    }
  })
);
$('file').onchange = e => {
  if (e.target.files[0]) load(e.target.files[0]);
  e.target.value = '';
};
document.addEventListener('dragover', e => {
  e.preventDefault();
  $('drop').classList.add('over');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) $('drop').classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) load(f);
});
$('name').addEventListener('input', () => {
  store.set('sched.name', $('name').value.trim());
  render();
});
(async () => {
  // 처음 화면 모드: 지난번 고른 것, 없으면 링크·앱은 쉬운 화면
  const ez0 = store.get('sched.easy');
  document.body.classList.toggle('easy', ez0 ? ez0 === '1' : !!(LINK || APP));
  syncMode();
  // 앱 안에서 지사 정보가 없으면: 일정이 공유된 지사 중에서 고르기 (하나면 바로)
  if ((APP || QS.get('pick') === '1') && !LINK && API) {
    try {
      const r = await run('listWeeks');
      const list = (r && r.ok && r.list) || [];
      const saved = store.get('sched.appBranch');
      let b = list.find(x => x.branch === saved) || (list.length === 1 ? list[0] : null);
      if (!b && list.length) b = await new Promise(res => branchPick(list, res));
      if (b) {
        store.set('sched.appBranch', b.branch);
        LINK = { b: b.branch, n: '', easy: true };
      } else {
        $('msg').className = 'msg err';
        $('msg').textContent = '아직 일정표가 공유된 지사가 없어요. 지사에서 누군가 일정표를 올리면 여기에 나와요.';
      }
    } catch (e) {}
  }
  if (LINK) {
    // 이름 링크: 지사에 공유된 일정표로 바로 시작 (쉬운 화면이 기본)
    document.body.classList.add('linkmode');
    document.querySelector('#startView h1').innerHTML = `<span id="who0"></span>${esc(LINK.b)} 이번 주 검사 일정`;
    if (!ez0) document.body.classList.toggle('easy', LINK.easy !== false);
    syncMode();
    if (LINK.n) {
      $('name').value = LINK.n;
      store.set('sched.name', LINK.n);
    }
    if (API && !window.SHARED) {
      // Vercel: 공유 일정표를 서버에서 받아 옴
      $('msg').textContent = '일정 불러오는 중…';
      try {
        const wk = await run('getWeek', LINK.b);
        if (wk && wk.ok) window.SHARED = wk;
      } catch (e) {}
      $('msg').textContent = '';
    }
    const sh = window.SHARED;
    if (sh && sh.days && sh.days.length) {
      const wk = { source: sh.source || LINK.b + ' 공유 일정표', days: sh.days };
      data = wk;
      const names = allNames();
      if (curName() && names.includes(curName())) startShared();
      else {
        // 이름부터 고르기 (큰 버튼)
        $('name').value = '';
        data = null;
        render();
        namePick(names, wk);
      }
    } else {
      render();
      const m = $('msg');
      m.className = 'msg err';
      m.textContent = LINK.b + '에 공유된 일정표가 아직 없어요. 일정표를 올리는 분께 "지사에 공유하기"를 눌러 달라고 해 주세요.';
    }
    easyToggle();
  } else render();
  // 위젯에서 현장을 눌러 열었을 때 (?d=날짜): 지난번 일정표를 이어서 그날 하루 보기로
  if (window.START_DAY && !data && $('resumeGo')) {
    $('resumeGo').click();
    if (days.some(x => x.iso === window.START_DAY)) go(window.START_DAY);
  }
})();
