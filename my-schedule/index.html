<title>내 검사 일정</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f5fbf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column — sticky app bar + swipeable day tabs, one day's site cards at a time */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --accent: #1f5fbf;
  --accent-ink: #ffffff;
  --accent-soft: #e6eefa;
  --k-jeong: #2a3440;
  --k-mil: #1d7fc4;
  --k-su: #c27a0e;
  --k-wan: #c2392f;
  --off: #8a6d1e;
  --off-soft: #f8f0dc;
  --hero: #1f5fbf;
  --hero-ink: #ffffff;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic',
    system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0f1419;
    --surface: #19212a;
    --ink: #e6ebf0;
    --muted: #94a2b0;
    --line: #2a3541;
    --accent: #6ea6f5;
    --accent-ink: #0f1419;
    --accent-soft: #1d2d44;
    --k-jeong: #c9d3dd;
    --k-mil: #5fb4ec;
    --k-su: #e7a84a;
    --k-wan: #f07c72;
    --off: #e2c06e;
    --off-soft: #2e2818;
    --hero: #1e3a66;
    --hero-ink: #eef4ff;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0f1419;
  --surface: #19212a;
  --ink: #e6ebf0;
  --muted: #94a2b0;
  --line: #2a3541;
  --accent: #6ea6f5;
  --accent-ink: #0f1419;
  --accent-soft: #1d2d44;
  --k-jeong: #c9d3dd;
  --k-mil: #5fb4ec;
  --k-su: #e7a84a;
  --k-wan: #f07c72;
  --off: #e2c06e;
  --off-soft: #2e2818;
  --hero: #1e3a66;
  --hero-ink: #eef4ff;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
[hidden] {
  display: none !important;
}
html,
body {
  min-height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.col {
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}
button,
input {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* app bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}
.bar.scrolled {
  border-bottom-color: var(--line);
}
.bar-in {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-block: 12px 10px;
}
.who {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.who small {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.who b {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.who b em {
  font-style: normal;
  color: var(--accent);
}
.ghost {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  min-height: 40px;
  white-space: nowrap;
}

/* day tabs */
.tabs {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 6px;
  padding-block: 2px 12px;
}
.tab {
  min-width: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 7px 2px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-height: 68px;
  cursor: pointer;
}
.tab .dw {
  font-size: 11.5px;
  color: var(--muted);
}
.tab .dd {
  font: 600 clamp(13px, 4.1vw, 17px) var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.tab .st {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
}
.tab.off .st {
  color: var(--off);
}
.tab.none .st {
  color: var(--muted);
}
.tab.today {
  border-color: var(--accent);
}
.tab[aria-selected='true'] {
  background: var(--accent);
  border-color: var(--accent);
}
.tab[aria-selected='true'] .dw,
.tab[aria-selected='true'] .dd,
.tab[aria-selected='true'] .st {
  color: var(--accent-ink);
}

main {
  padding-block: 4px 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.week {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.week b {
  color: var(--ink);
  font-family: var(--font-mono);
  font-weight: 600;
}

.dayhead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.dayhead h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.dayhead h2 span {
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 6px;
}
.pill {
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 999px;
  padding: 3px 10px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}
.pill.off {
  background: var(--off-soft);
  color: var(--off);
}
.pill.none {
  background: var(--surface);
  color: var(--muted);
}
.brief {
  margin: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.brief p {
  margin: 0;
  text-wrap: pretty;
}
.brief .crew {
  font-size: 13.5px;
  color: var(--muted);
}
.brief .crew b {
  color: var(--ink);
}

.stops {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stop {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.t {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
.nm {
  font-weight: 600;
  font-size: 16.5px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.meta {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}
.kind {
  font-style: normal;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid currentColor;
  border-radius: 5px;
  padding: 0 6px;
  line-height: 1.5;
}
.k-정 {
  color: var(--k-jeong);
}
.k-밀 {
  color: var(--k-mil);
}
.k-수 {
  color: var(--k-su);
}
.k-설,
.k-완 {
  color: var(--k-wan);
}
.u {
  font: 600 17px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}
.u small {
  font: 400 13px var(--font-body);
  color: var(--muted);
  margin-left: 1px;
}
.maps {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.maps a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid var(--line);
}
.maps a:active {
  background: var(--accent-soft);
}
.note {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}
.empty-day {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 16px;
  text-align: center;
}
.others {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px dashed var(--line);
  padding-top: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.others b {
  color: var(--ink);
  font-weight: 600;
}
.wday {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.wday-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
}
.wday-h strong {
  font-size: 17px;
}
.wday-h strong span {
  font-size: 13.5px;
  color: var(--muted);
  font-weight: 500;
  margin-left: 5px;
}
.wlist {
  list-style: none;
  margin: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.wlist li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
}
.wlist li:first-child {
  border-top: 0;
}
.wlist .t,
.wlist .u {
  font-size: 15px;
}
.wlist .nm {
  font-size: 15px;
}
.wlist .others {
  border: 0;
  padding: 2px 0 0;
  font-size: 12.5px;
}
.wlist.flat {
  padding: 12px 14px;
  color: var(--muted);
  font-size: 14px;
}
.kmap {
  height: 260px;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
}
.pin {
  min-width: 26px;
  height: 26px;
  padding: 0 7px;
  border-radius: 13px;
  background: #1f5fbf;
  color: #fff;
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
  display: grid;
  place-items: center;
  font: 600 12px var(--font-mono);
  white-space: nowrap;
}
.pin.home {
  background: #18212b;
}
.legs {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 14px;
}
.legs h3 {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
  font-weight: 600;
}
.leg {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: baseline;
}
.leg span:first-child {
  overflow-wrap: anywhere;
}
.leg .km {
  font: 600 15px var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.leg.total {
  border-top: 1px solid var(--line);
  padding-top: 8px;
  font-weight: 700;
}
.legs .copy {
  justify-self: start;
  margin-top: 4px;
}
.legs .route {
  font-size: 12.5px;
  color: var(--muted);
  user-select: all;
  overflow-wrap: anywhere;
}
.hint {
  font-size: 12.5px;
  color: var(--muted);
  text-align: center;
  margin: 6px 0 0;
}

/* first screen */
.start {
  padding-block: 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.start h1 {
  margin: 0;
  font-size: 26px;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.start h1 em {
  font-style: normal;
  color: var(--accent);
}
.start p {
  margin: 0;
  color: var(--muted);
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.field label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.field input {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 17px;
  font-weight: 600;
  width: 100%;
}
.big {
  border: 0;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 14px;
  min-height: 56px;
  font-size: 17px;
  font-weight: 700;
  width: 100%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
label.ghost {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  pointer-events: none;
}
.vh:focus-visible + * {
  outline: 2px solid var(--accent);
}
.err-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--k-wan);
  color: #fff;
  font-size: 13px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px))
    calc(10px + env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
}
.drop {
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  font-size: 13.5px;
  color: var(--muted);
}
.drop.over {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--ink);
}
.msg {
  font-size: 14px;
  text-align: center;
  min-height: 1.5em;
}
.msg.err {
  color: var(--k-wan);
}
@media (hover: none) {
  .drop {
    display: none;
  }
}
@media (max-width: 359px) {
  body {
    font-size: 15px;
  }
  .t,
  .u {
    font-size: 15px;
  }
  .nm {
    font-size: 15.5px;
  }
  .tabs {
    gap: 4px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .panel {
    animation: in 0.18s ease-out;
  }
  @keyframes in {
    from {
      opacity: 0.4;
      transform: translateX(var(--dx, 0));
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}

/* ---- 하루 보기 (요약 · 지도 · 타임라인) ---- */
.panel{display:flex;flex-direction:column;gap:12px}
.sum{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 6px 18px -10px rgba(20,50,110,.55)}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum-date{font:600 15px var(--font-body);opacity:.85}
.sum-team{font-size:12.5px;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:1px 9px;opacity:.85}
.sum-foot{font-size:13px;opacity:.85;border-top:1px solid rgba(255,255,255,.22);padding-top:9px}
.kmap{position:relative}
.kload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);padding:16px}
.kload small{font-weight:400;color:var(--muted);font-size:12.5px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legs .wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.legs .wait .spin{width:18px;height:18px;border-width:2px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:12px}
.tl-item::before{content:"";position:absolute;left:13px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font:600 13px var(--font-mono);position:relative;z-index:1;margin-top:10px}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-head{display:flex;align-items:center;gap:8px}
.tl-head .t{font-size:16px;padding:0}
.tl-head .u{margin-left:auto;font-size:15px}
.tl-card .nm{font-size:16px}
.addr{font-size:13px;color:var(--muted)}
.tl-card .others{margin-top:2px}
.tl-card .maps{margin-top:4px}
.tl-card .maps a{min-height:36px;font-size:13.5px;border-radius:9px}
.sum{gap:6px}
.sum-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sum-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;
  border-top:1px solid rgba(255,255,255,.13)}
.sum-list li:first-child{border-top:0}
.sum-list .st{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
.sum-list .sn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-list .sa{font-size:12.5px;font-weight:400;opacity:.72;margin-left:6px}
.sum-list .sk{font-size:12.5px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.16);border-radius:6px;padding:1px 7px}
.sum-foot{padding-top:8px;margin-top:2px}
.branch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.branch select{font:600 14px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.branch small{font-size:12px}
.branch .juris{flex-basis:100%;color:var(--muted);line-height:1.4}
.real{white-space:nowrap;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:4px}
.maps.three{grid-template-columns:1fr 1fr 1fr}
.leg .km small{font:400 12px var(--font-body);color:var(--muted)}
.dayroute{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.dayroute b{font-size:14px}
.dayroute small{font-size:12.5px;color:var(--muted)}
.dayroute .maps a{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.maps button{font:600 13.5px var(--font-body);min-height:36px;border-radius:9px;background:var(--bg);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.resume{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.resume.old{border-color:var(--line)}
.resume small{color:var(--muted);font-size:12.5px}
.resume b{font-size:16px}
/* 버튼 글자가 항상 버튼 안에 들어가게: 좁으면 글자를 줄이고 두 줄까지 */
.maps a,.maps button{min-width:0;padding:6px 6px;font-size:clamp(11.5px,3.5vw,14px);line-height:1.25;text-align:center;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center}
.maps.three a,.maps.three button{font-size:clamp(11px,3.2vw,13.5px);padding:6px 4px}
.ghost,.tab{min-width:0}

<script>
// 화면 스크립트가 멈추면 이유를 아래 빨간 줄에 표시 (문제 줄의 실제 내용도 같이)
function errLine(n) {
  if (!n) return '';
  const pick = t => ((t || '').split('\n')[n - 1] || '').trim().slice(0, 90);
  const own = [...document.scripts]
    .filter(x => !x.src)
    .sort((a, b) => b.text.length - a.text.length)[0];
  const a = pick(own && own.text);
  const b = pick(document.documentElement.outerHTML);
  return (a ? ' · 스크립트 줄: ' + a : '') + (b ? ' · 문서 줄: ' + b : '');
}
window.addEventListener(
  'error',
  e => {
    const b = document.getElementById('errBar');
    if (!b) return;
    b.hidden = false;
    b.textContent =
      '화면 오류: ' +
      (e.message ||
        (e.target && e.target.src
          ? '불러오지 못함 ' + e.target.src
          : '알 수 없음')) +
      (e.lineno ? ' (' + e.lineno + '번째 줄)' : '') +
      (e.filename
        ? ' · 파일: ' + (e.filename.split('?')[0].split('/').pop() || '화면')
        : '') +
      errLine(e.lineno);
  },
  true
);
</script>

<script>
function parseItems(items, yearHint) {
  const Y = yearHint || new Date().getFullYear();
  // headers
  const heads = items.filter(
    i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s) && !/~/.test(i.s)
  );
  if (heads.length < 1)
    throw new Error('날짜 머리글(예: 10/12 (월))을 찾지 못했어요.');
  const hy = Math.min(...heads.map(h => h.y));
  const cols = heads
    .filter(h => Math.abs(h.y - hy) < 6)
    .map(h => ({ c: h.x + h.w / 2, s: h.s.trim() }))
    .sort((a, b) => a.c - b.c);
  const sp =
    cols.length > 1
      ? (cols[cols.length - 1].c - cols[0].c) / (cols.length - 1)
      : cols[0].c;
  cols.forEach((c, k) => {
    c.l = k ? (cols[k - 1].c + c.c) / 2 : c.c - sp / 2;
    c.r = k < cols.length - 1 ? (c.c + cols[k + 1].c) / 2 : c.c + sp / 2;
    const m = c.s.match(/(\d{1,2})\/(\d{1,2})/);
    const d = new Date(Y, +m[1] - 1, +m[2]);
    c.date = d;
  });
  const labels = items
    .filter(i => /^\s*\d{1,2}\s*조\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2)
    .map(i => ({ y: i.y, t: i.s.replace(/\s/g, '') }))
    .sort((a, b) => a.y - b.y);
  const rowLabels = items.filter(
    i => /^\s*(행사|복무)\s*$/.test(i.s) && i.x + i.w <= cols[0].l + 2
  );
  const firstMisc = rowLabels.length
    ? Math.min(...rowLabels.map(i => i.y))
    : Infinity;
  // 행사·복무 같은 머리글이 없는 양식: 마지막 조 칸 다음부터를 기타(휴가·비고) 영역으로
  const spacing =
    labels.length > 1
      ? (labels[labels.length - 1].y - labels[0].y) / (labels.length - 1)
      : Infinity;
  const miscStart = Math.min(
    firstMisc,
    labels.length > 1 ? labels[labels.length - 1].y + spacing * 0.99 : Infinity
  );
  const NAMES =
    /^\s*[가-힣A-Za-z]{2,6}\s*\([^)]*\)\s*(\/\s*[가-힣A-Za-z]{2,6}\s*\([^)]*\)\s*)+$/;
  const LEAVE = /연차|휴가|병가|돌봄|출산|공가|경조|건강|휴직/;
  const days = cols.map(c => {
    const its = items.filter(
      i => i.y > hy + 3 && i.x + i.w / 2 >= c.l && i.x + i.w / 2 < c.r
    );
    // group lines by y
    its.sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    for (const it of its) {
      const L = lines[lines.length - 1];
      if (L && Math.abs(L.y - it.y) < 3) {
        L.parts.push(it);
      } else lines.push({ y: it.y, parts: [it] });
    }
    lines.forEach(L => {
      L.parts.sort((a, b) => a.x - b.x);
      let s = '',
        end = null;
      for (const p of L.parts) {
        if (end !== null && p.x - end > 2) s += ' ';
        s += p.s;
        end = p.x + p.w;
      }
      L.s = s.trim();
    });
    const teams = [];
    let buf = '';
    let misc = '';
    for (const L of lines) {
      if (!L.s) continue;
      if (
        L.y >= miscStart - 3 ||
        /^(휴가자|임피|검사지원)/.test(L.s) ||
        /(휴가자|검사지원):/.test(L.s)
      ) {
        // 앞줄에서 이어지는 줄('(건강),한상호' 등)은 붙이고, 나머지는 새 줄로
        misc += (misc && !/^[(,]/.test(L.s) ? '\n' : '') + L.s;
        continue;
      }
      if (/^\d+$/.test(L.s)) continue; // 빈 칸의 '0' 같은 숫자
      let sm = L.s.match(/^\[(\d+)현장\s*([\d.]+)대\]\s*(.*)$/);
      if (!sm && NAMES.test(L.s)) sm = [L.s, null, null, L.s]; // 현장수 없이 이름만 있는 요약
      if (sm) {
        const lab = labels.filter(l => l.y <= L.y + 1).pop();
        const stops = parseStops(buf);
        teams.push({
          team: lab ? lab.t : '',
          sites: sm[1] != null ? +sm[1] : places(stops).length,
          units:
            sm[2] != null ? +sm[2] : stops.reduce((a, x) => a + (x.units || 0), 0),
          members: sm[3]
            .split('/')
            .map(x => x.trim())
            .filter(Boolean),
          stops
        });
        buf = '';
        continue;
      }
      if (/^\d{1,2}:\d{2}/.test(L.s)) buf += '\n' + L.s;
      else buf += L.s;
    }
    const vac = new Set();
    const vm = misc.match(/휴가자:([^\n]*?)(?=임피:|검사지원:|$)/m);
    if (vm)
      vm[1].split(',').forEach(x => {
        if (x.trim()) vac.add(x.trim());
      });
    for (const m of misc.matchAll(/([가-힣]{2,4})\s*\(([^)]*)\)/g))
      if (LEAVE.test(m[2])) vac.add(m[1] + '(' + m[2] + ')');
    const notes = misc
      .split('\n')
      .map(x => x.trim())
      .filter(
        x =>
          x &&
          !/^\d+$/.test(x) &&
          !/^휴가자:/.test(x) &&
          !/^[가-힣]{2,4}\s*\([^)]*\)(\s*[-~].*)?$/.test(x)
      );
    return {
      label: c.s,
      iso: fmt(c.date),
      teams,
      vacation: [...vac],
      support: notes
    };
  });
  // 주말처럼 아무것도 없는 날은 뺌
  return days.filter(d => d.teams.length || d.vacation.length || d.support.length);
}
function fmt(d) {
  return (
    d.getFullYear() +
    '-' +
    String(d.getMonth() + 1).padStart(2, '0') +
    '-' +
    String(d.getDate()).padStart(2, '0')
  );
}
function parseStops(buf) {
  return buf
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .map(s => {
      let memo = '';
      const mm = s.match(/^(.*\(\d+\))\s*-\s*(.+)$/);
      if (mm) {
        s = mm[1];
        memo = mm[2].trim();
      }
      const m = s.match(
        /^(\d{1,2}:\d{2})\s*\[([^\]]+)\]\s*(?:\[([^\]]+)\])?\s*(?:\[(.*)\]|(.*?))\s*(?:\((\d+)\))?\s*$/
      );
      if (!m) return { time: '', kind: '', area: '', name: s, units: null };
      let name = (m[4] !== undefined ? m[4] : m[5] || '').trim();
      if (m[4] === undefined) {
        const u = name.match(/^(.*)\((\d+)\)$/);
        if (u && !m[6]) {
          name = u[1];
          m[6] = u[2];
        }
      }
      return {
        time: m[1],
        kind: m[2],
        area: m[3] && m[3] !== '주소불명' ? m[3] : '',
        name,
        units: m[6] ? +m[6] : null,
        memo
      };
    });
}

const KIND = { 정: '정기', 밀: '정밀', 수: '수시', 완: '설치', 설: '설치' };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];

const esc = s =>
  String(s).replace(
    /[&<>"]/g,

const bare = s => s.replace(/\(.*?\)/g, '').trim();
const todayIso = (() => {

// 동·읍·면 → 시·구 (일정표에는 동 이름만 있어 검색이 엉뚱한 지역으로 가지 않게)
const REGION = (() => {

  );
  add(
    '고양시 일산동구',
    '장항동 백석동 마두동 식사동 풍동 중산동 정발산동 사리현동 설문동 지영동 문봉동 성석동 산황동'
  );
  add(

    '일산동 주엽동 대화동 탄현동 덕이동 가좌동 법곳동 구산동'

  add(
    '파주시',
    '금촌동 아동동 야동동 검산동 맥금동 교하동 야당동 동패동 목동동 와동동 당하동 문발동 신촌동 상지석동 하지석동 서패동 다율동 산남동 연다산동 오도동 송촌동 문산읍 파주읍 법원읍 조리읍 탄현면 광탄면 적성면 파평면 월롱면 군내면 장단면 진동면 진서면'
  );
  return m;
})();
function placeName(n) {
  return (
    n
      .replace(/\(주\)|㈜/g, '')
      .replace(/\([^)]*$/, '')
      .replace(/\s*[A-Z0-9,\s]+동(,\s*[A-Z0-9]+동)*\s*$/, '')
      .replace(/\s+/g, ' ')
      .trim() || n
  );
}
function mapQuery(st) {
  let n = placeName(st.name);
  if (st.area && n.startsWith(st.area + ' ')) n = n.slice(st.area.length + 1);
  const goyang = !BRANCH || BRANCH[0] === '고양파주지사';
  const pre = goyang && REGION[st.area] ? REGION[st.area] : province();
  return [st.area ? pre + ' ' + st.area : '', n]
    .join(' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function mapUrl(st) {
  return 'https:\/\/map.kakao.com/?eName=' + encodeURIComponent(mapQuery(st));
}
function naverUrl(st) {
  return 'https:\/\/map.naver.com/p/search/' + encodeURIComponent(mapQuery(st));
}
function sumUnits(stops) {
  return stops.reduce((a, s) => a + (s.units || 0), 0);
}
function places(stops) {
  const seen = [];
  stops.forEach(s => {
    if (!seen.includes(s.name)) seen.push(s.name);
  });
  return seen;
}
function areas(stops) {
  const a = [];
  stops.forEach(s => {
    if (s.area && !a.includes(s.area)) a.push(s.area);
  });
  return a;
}

function mine(name) {
  return data.days.map(d => {
    const t = d.teams.find(t => t.members.some(m => bare(m) === name));
    const off = d.vacation.some(v => bare(v) === name);
    const sup = d.support.filter(s => s.includes(name));
    return { ...d, t, off, sup };
  });
}
function mdow(d) {
  const [y, m, dd] = d.iso.split('-').map(Number);
  const dt = new Date(y, m - 1, dd);
  return { md: m + '/' + dd, dow: DOW[dt.getDay()] };
}
function briefText(d, name) {
  const t = d.t,
    st = t.stops,
    pl = places(st),
    ar = areas(st);
  const mates = t.members.filter(m => bare(m) !== name).map(bare);
  const first = st[0],
    last = st[st.length - 1];
  let s =
    (ar.length ? ar.join('·') + '에서 ' : '') +
    pl.length +
    '곳, 승강기 ' +
    sumUnits(st) +
    '대를 봐요. ';
  if (first) s += first.time + ' ' + first.name + '에서 시작';
  if (last && last !== first)
    s += '해 ' + last.time + ' ' + last.name + '에서 마무리';
  s += '합니다.';
  if (st.some(x => !x.area))
    s += ' 주소가 표에 없는 현장이 있으니 미리 확인하세요.';
  return { s, mates };
}

let sel = null; // 선택한 날짜 iso, 또는 'week'
// 지사 목록 (data/branches.tsv) — 출발지·검색 지역 기준
const BRANCHES = [
  ['진주본사', '경남 진주시 소호로 102 (충무공동)'],
  ['서울지역본부', '서울 구로구 디지털로31길 41'],

  ['서울동부지사', '서울 성동구 천호대로 376'],
  ['서울서부지사', '서울 마포구 토정로 318'],
  ['서울북부지사', '서울 도봉구 삼양로 538-5'],
  ['서울강남지사', '서울 강남구 영동대로 316'],
  ['서울강동지사', '서울 강동구 양재대로 1473'],
  ['서울서초지사', '서울 서초구 서초대로 67'],
  ['서울강서지사', '서울 강서구 공항대로 287'],
  ['부산서부지사', '부산 부산진구 황령대로 24'],
  ['부산동부지사', '부산 해운대구 센텀중앙로 90'],

async function drawDayMap(stops) {

      map,
      path: path.map(LL),
      strokeWeight: 3,
      strokeColor: '#1f5fbf',
      strokeOpacity: 0.7,
      strokeStyle: 'shortdash'

    sx = null;
    if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
    const order = ['week', ...days.map(d => d.iso)];
    const i = order.indexOf(sel);
    const n = order[i + (dx < 0 ? 1 : -1)];
    if (n) go(n, dx < 0 ? 40 : -40);
  },
  { passive: true }
);
addEventListener(
  'scroll',
  () => $('bar').classList.toggle('scrolled', scrollY > 4),
  { passive: true }
);

// ---------- file loading ----------
async function pdfItems(buf) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const items = [];
  let off = 0;
  for (let p = 1; p <= doc.numPages; p++) {
    const pg = await doc.getPage(p);
    const vp = pg.getViewport({ scale: 1 });
    const tc = await pg.getTextContent();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      items.push({
        x: it.transform[4],
        y: vp.height - it.transform[5] + off,
        w: it.width,
        s: it.str
      });
    }
    off += vp.height;
  }
  return items;
}
function sheetItems(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: false });
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn];
    if (!ws['!ref']) continue;
    const R = XLSX.utils.decode_range(ws['!ref']);
    const merges = ws['!merges'] || [];
    const items = [];
    for (let r = R.s.r; r <= R.e.r; r++)
      for (let c = R.s.c; c <= R.e.c; c++) {
        const cell = ws[XLSX.utils.encode_cell({ r, c })];
        if (!cell || cell.v == null || cell.v === '') continue;
        let s = cell.w != null ? String(cell.w) : String(cell.v);
        if (cell.t === 'n' && cell.z && XLSX.SSF.is_date(cell.z)) {
          const dc = XLSX.SSF.parse_date_code(cell.v);
          s =
            dc.m +
            '/' +
            dc.d +
            ' (' +
            DOW[new Date(dc.y, dc.m - 1, dc.d).getDay()] +
            ')';
        }
        if (cell.t === 'd') {
          const dt = new Date(cell.v);
          s =
            dt.getMonth() +
            1 +
            '/' +
            dt.getDate() +
            ' (' +
            DOW[dt.getDay()] +
            ')';
        }
        const mg = merges.find(m => m.s.r === r && m.s.c === c);
        const w = mg ? (mg.e.c - mg.s.c + 1) * 100 : 100;
        s.split(/\r?\n/).forEach((ln, i) => {
          if (ln.trim())
            items.push({ x: c * 100, y: r * 50 + i * 4, w, s: ln.trim() });
        });
      }
    if (items.some(i => /^\s*\d{1,2}\/\d{1,2}\s*(\(.\))?\s*$/.test(i.s)))
      return { items, sheet: sn };
  }
  throw new Error(
    '엑셀에서 날짜 머리글(예: 10/12 (월))이 있는 시트를 찾지 못했어요.'
  );
}

async function load(file) {
  const msg = $('msg');
  msg.className = 'msg';
  msg.textContent = file.name + ' 읽는 중…';
  try {
    if (typeof pdfjsLib === 'undefined' || typeof XLSX === 'undefined')
      throw new Error(
        '파일 읽기 도구(cdnjs.cloudflare.com)를 불러오지 못했어요. 인터넷 연결이나 회사망 차단을 확인해 주세요.'
      );
    const buf = await file.arrayBuffer();
    const yr = (file.name.match(/20\d\d/) || [])[0];
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    const items = isPdf ? await pdfItems(buf) : sheetItems(buf).items;
    const t = items.find(i => /일정표/.test(i.s));
    const yy = t && (t.s.match(/(\d{2})년/) || [])[1];
    const ds = parseItems(items, yr ? +yr : yy ? 2000 + +yy : undefined);
    if (!ds.some(d => d.teams.length))
      throw new Error(
        '조별 일정([n현장 n대] 줄)을 찾지 못했어요. 지사 검사 일정표 양식이 맞는지 확인해 주세요.'
      );
    data = {
      source: t ? t.s.replace(/^[\s-]+/, '').trim() : file.name,
      days: ds
    };
    sel = null;
    msg.textContent = '';
    saveLast();
    const fromTitle = branchFromText((t ? t.s : '') + ' ' + file.name);
    const saved = branchByName(store.get('sched.branch'));
    if (fromTitle) setBranch(fromTitle, 'title');
    else {
      setBranch(saved, saved ? 'saved' : '');
      guessBranch();
    }
    render();
    window.scrollTo({ top: 0 });
  } catch (e) {
    if (data) {
      data = null;
      render();
    }
    msg.className = 'msg err';
    msg.textContent = e.message || '파일을 읽지 못했어요.';
  }
}
// 지난 일정표: 이 휴대폰에 저장해 두고 첫 화면에서 '이어서 보기'
function saveLast() {
  try {
    store.set('sched.last', JSON.stringify({ data, at: Date.now() }));
  } catch (e) {}
}
function resumeCard() {
  const el = $('resume');
  let last = null;
  try {
    last = JSON.parse(store.get('sched.last') || 'null');
  } catch (e) {}
  if (!last || !last.data || !last.data.days || !last.data.days.length) {
    el.hidden = true;
    return;
  }
  const ds = last.data.days;
  const past = ds[ds.length - 1].iso < todayIso;
  const at = new Date(last.at);
  el.hidden = false;
  el.classList.toggle('old', past);
  el.innerHTML = `<small>${past ? '지난주 일정표예요 · 새 파일을 올려 주세요' : '지난번에 올린 일정표'}</small>
    <b>${esc(last.data.source || '검사 일정표')}</b>
    <small>${at.getMonth() + 1}/${at.getDate()} ${String(at.getHours()).padStart(2, '0')}:${String(at.getMinutes()).padStart(2, '0')}에 올림</small>
    <div class="maps"><button type="button" class="${past ? '' : 'call'}" id="resumeGo">이어서 보기</button><button type="button" id="resumeDel">지우기</button></div>`;
  $('resumeGo').onclick = () => {
    data = last.data;
    sel = null;
    const fromTitle = branchFromText(data.source || '');
    const saved = branchByName(store.get('sched.branch'));
    setBranch(fromTitle || saved, fromTitle ? 'title' : saved ? 'saved' : '');
    if (!fromTitle && !saved) guessBranch();
    render();
  };
  $('resumeDel').onclick = () => {
    store.set('sched.last', '');
    resumeCard();
  };
}
// 버튼은 <label for="file"> 라서 스크립트 없이도 파일 선택이 열림. 키보드(Enter·Space)만 처리
['pick', 'repick'].forEach(id =>
  $(id).addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      $('file').click();
    }
  })
);
$('file').onchange = e => {
  if (e.target.files[0]) load(e.target.files[0]);
  e.target.value = '';
};
document.addEventListener('dragover', e => {
  e.preventDefault();
  $('drop').classList.add('over');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget) $('drop').classList.remove('over');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) load(f);
});
$('name').addEventListener('input', () => {
  store.set('sched.name', $('name').value.trim());
  render();
});
render();
// 위젯에서 현장을 눌러 열었을 때 (?d=날짜): 지난번 일정표를 이어서 그날 하루 보기로
if (window.START_DAY && !data && $('resumeGo')) {
  $('resumeGo').click();
  if (days.some(x => x.iso === window.START_DAY)) go(window.START_DAY);
}
</script>
