# 오늘 현장 위젯 앱(my-schedule/android)을 빌드해서
# 릴리스 "widget-apk" 에 schedule-widget.apk 로 올림 (휴대폰에서 바로 받기용).
# 여비청구 앱과는 무관.

name: 위젯 앱 빌드

on:
  push:
    branches: [my-schedule, claude/nifty-sagan-s6rbvp]
    paths:
      - my-schedule/android/**
      - .github/workflows/build-widget-apk.yml
  workflow_dispatch:

concurrency:
  group: widget-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 플레이스토어 업로드 키가 GitHub 비밀값에 있으면 서명된 AAB 를 만든다 (my-schedule/PLAYSTORE.md)
      HAS_PLAY_KEY: ${{ secrets.PLAY_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 플레이스토어 업로드 키 꺼내기
        if: env.HAS_PLAY_KEY == 'true'
        run: |
          echo "${{ secrets.PLAY_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/play-upload.jks"
          echo "PLAY_KEYSTORE=$RUNNER_TEMP/play-upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_KEYSTORE_PASS=${{ secrets.PLAY_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
      - name: 빌드 (링크용 APK + 플레이스토어용 AAB)
        run: gradle -p my-schedule/android --no-daemon assembleApkRelease bundlePlayRelease
      - name: 파일 이름 정리
        run: |
          cp my-schedule/android/app/build/outputs/apk/apk/release/app-apk-release.apk schedule-widget.apk
          cp my-schedule/android/app/build/outputs/bundle/playRelease/app-play-release.aab today-site-play.aab
      - name: 플레이스토어용 AAB 보관 (Actions 실행 화면 아래 Artifacts 에서 받기)
        if: env.HAS_PLAY_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab
          path: today-site-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: schedule-widget
          path: schedule-widget.apk
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 앱이 새 버전을 알아보는 데 쓰는 줄 (versionCode=N, versionName=X) — 지우지 말 것
          VC=$(grep -oE 'versionCode [0-9]+' my-schedule/android/app/build.gradle | grep -oE '[0-9]+')
          VN=$(grep -oE "versionName '[^']+'" my-schedule/android/app/build.gradle | cut -d"'" -f2)
          gh release delete widget-apk -y --cleanup-tag || true
          gh release create widget-apk schedule-widget.apk \
            --target "$GITHUB_SHA" --title "오늘 현장 위젯 앱 $VN" \
            --notes "휴대폰에서 schedule-widget.apk 를 눌러 받아 설치하세요.

          versionCode=$VC versionName=$VN ($GITHUB_REF_NAME, ${GITHUB_SHA::7})"
